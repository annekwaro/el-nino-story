<section class="hero" id="top" aria-labelledby="hero-title">
  <div class="hero__inner">
    <h1 class="hero__title" id="hero-title">El Niño</h1>
    <p class="hero__subtitle">The ocean that rewrites weather.</p>

    <figure class="hero__figure">
      <div class="hero__maps">
        @if (frames.value(); as grids) {
          @for (grid of grids; track grid.month; let i = $index) {
            <el-sst-map
              class="hero__map"
              [class.is-active]="i === active()"
              [attr.aria-hidden]="i !== active()"
              [data]="grid"
              [bare]="true"
            />
          }
        }
      </div>

      <figcaption class="hero__caption">
        <div class="hero__frames" role="group" aria-label="Sea-surface temperature, December of">
          @for (label of labels(); track label.month; let i = $index) {
            <button
              type="button"
              class="hero__frame"
              [class.hero__frame--warm]="label.warm"
              [class.hero__frame--cool]="label.cool"
              [attr.aria-pressed]="i === active()"
              (click)="show(i)"
            >
              <span class="hero__frame-month el-num">{{ label.month }}</span>
              <span class="hero__frame-phase">{{ label.phase }}</span>
            </button>
          }
        </div>

        <div class="hero__meta">
          @if (!reduced()) {
            <button type="button" class="hero__play" (click)="playing.set(!playing())">
              {{ playing() ? 'Pause' : 'Play' }}
            </button>
          }
          <span class="hero__legend">
            <span class="el-num">−3</span>
            <span class="hero__ramp" aria-hidden="true"></span>
            <span class="el-num">+3 °C</span>
          </span>
          <span class="hero__source">Sea-surface temperature vs 1991–2020 · NOAA ERSST v5</span>
        </div>
      </figcaption>
    </figure>
  </div>

  <a class="hero__cue" href="#chapter-02">
    <span class="hero__cue-label el-kicker">Scroll</span>
    <span class="hero__cue-line" aria-hidden="true"></span>
  </a>
</section>
