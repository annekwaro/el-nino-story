<div class="frame" elReveal>
  <svg
    class="chart"
    [attr.width]="width()"
    [attr.height]="height()"
    [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
    role="img"
    [attr.aria-label]="ariaLabel()"
    (pointermove)="onPointer($event)"
    (pointerleave)="hoverIndex.set(null)"
  >
    @if (width() > 0) {
      @for (tick of yTicks(); track tick.value) {
        <line
          class="grid"
          [class.grid--zero]="tick.value === 0"
          [attr.x1]="margin.left"
          [attr.x2]="width() - margin.right"
          [attr.y1]="tick.y"
          [attr.y2]="tick.y"
        />
        <text class="axis-label" [attr.x]="margin.left - 8" [attr.y]="tick.y" dy="0.32em" text-anchor="end">
          {{ tick.label }}
        </text>
      }

      <g class="plot">
        @for (bar of bars(); track bar.year; let i = $index) {
          <rect
            [attr.class]="'bar bar--' + bar.phase"
            [class.is-active]="hoverIndex() === i"
            [class.is-dimmed]="hoverIndex() !== null && hoverIndex() !== i"
            [attr.x]="bar.x"
            [attr.y]="bar.y"
            [attr.width]="bar.width"
            [attr.height]="bar.height"
            rx="1"
          />
        }
      </g>

      <line class="trend" [attr.x1]="trend().x1" [attr.y1]="trend().y1" [attr.x2]="trend().x2" [attr.y2]="trend().y2" />

      @for (tick of xTicks(); track tick.label) {
        <text class="axis-label" [attr.x]="tick.x" [attr.y]="height() - 8" text-anchor="middle">{{ tick.label }}</text>
      }

      @if (hover(); as h) {
        <text class="hover-label" [attr.x]="h.x" y="12" [attr.text-anchor]="h.anchor">{{ h.text }}</text>
      }
    }
  </svg>
</div>
