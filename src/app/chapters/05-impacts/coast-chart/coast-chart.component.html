<div class="frame" elReveal>
  <svg
    class="chart"
    [attr.width]="width()"
    [attr.height]="height()"
    [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
    role="img"
    [attr.aria-label]="ariaLabel()"
    (pointermove)="onPointer($event)"
    (pointerleave)="hoverIndex.set(null)"
  >
    @if (width() > 0) {
      <defs>
        <linearGradient id="coast-warm" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" class="stop-warm" />
          <stop offset="1" class="stop-warm-fade" />
        </linearGradient>
        <linearGradient id="coast-cool" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" class="stop-cool-fade" />
          <stop offset="1" class="stop-cool" />
        </linearGradient>
      </defs>

      @for (tick of yTicks(); track tick.value) {
        <line class="grid" [attr.x1]="margin.left" [attr.x2]="width() - margin.right" [attr.y1]="tick.y" [attr.y2]="tick.y" />
        <text class="axis-label" [attr.x]="margin.left - 8" [attr.y]="tick.y" dy="0.32em" text-anchor="end">
          {{ tick.label }}
        </text>
      }

      <g class="plot">
        <path class="area area--warm" [attr.d]="areas().warm" />
        <path class="area area--cool" [attr.d]="areas().cool" />
      </g>
      <line class="zero" [attr.x1]="margin.left" [attr.x2]="width() - margin.right" [attr.y1]="zeroY()" [attr.y2]="zeroY()" />

      @for (tick of xTicks(); track tick.label) {
        <text class="axis-label" [attr.x]="tick.x" [attr.y]="height() - 8" text-anchor="middle">{{ tick.label }}</text>
      }

      @for (peak of peaks(); track peak.label) {
        <g class="peak" [attr.transform]="'translate(' + peak.x + ' ' + peak.y + ')'">
          <circle r="3" />
          <text y="-9" [attr.text-anchor]="peak.anchor">{{ peak.label }}</text>
        </g>
      }

      @if (hover(); as h) {
        <g class="hover">
          <line [attr.x1]="h.x" [attr.x2]="h.x" [attr.y1]="margin.top - 6" [attr.y2]="height() - margin.bottom" />
          <circle [attr.cx]="h.x" [attr.cy]="h.y" r="4" [class.is-warm]="h.warm" />
          <text [attr.x]="h.x" y="12" [attr.text-anchor]="h.anchor">{{ h.text }}</text>
        </g>
      }
    }
  </svg>
</div>
